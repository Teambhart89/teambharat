<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SaltStayz — Share your feedback</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="styles.css" />
<style>
.feedback-wrap { max-width: 560px; margin: 6vh auto; }
.star-row { display: flex; gap: var(--space-3); }
.star-row input[type="radio"] {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
}
.star-row label {
  font-size: 38px; line-height: 1; cursor: pointer; color: var(--color-disabled-surface);
  transition: color var(--motion-fast) ease, transform var(--motion-instant) ease;
  -webkit-text-stroke: 1px #7a5200;
}
.star-row label:hover { transform: scale(1.12); }
.star-row.rated label { color: var(--color-disabled-surface); }
.star-row label.lit { color: #e8a807; }
.star-row input[type="radio"]:focus-visible + label {
  outline: 3px solid var(--color-border-muted); outline-offset: 2px; border-radius: var(--radius-xs);
}
.rating-caption { font-weight: 600; color: var(--color-text-secondary); min-height: 24px; }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="SaltStayz home">
      <span class="brand-mark" aria-hidden="true">S</span> SaltStayz
    </a>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="feedback-wrap card">
    <h2 id="fb-title">How was your stay?</h2>
    <p id="fb-intro" style="margin-bottom: var(--space-6);">Loading your stay details…</p>

    <div class="alert alert-error" id="fb-error" role="alert"></div>
    <div class="alert alert-success" id="fb-success" role="status"></div>

    <form class="form-grid" id="fb-form" hidden>
      <fieldset class="field" style="border:0;">
        <legend style="font-weight:600; margin-bottom: var(--space-3);">Your rating</legend>
        <div class="star-row" id="star-row">
          <input type="radio" name="rating" value="1" id="r1" /><label for="r1" aria-label="1 star">★</label>
          <input type="radio" name="rating" value="2" id="r2" /><label for="r2" aria-label="2 stars">★</label>
          <input type="radio" name="rating" value="3" id="r3" /><label for="r3" aria-label="3 stars">★</label>
          <input type="radio" name="rating" value="4" id="r4" /><label for="r4" aria-label="4 stars">★</label>
          <input type="radio" name="rating" value="5" id="r5" /><label for="r5" aria-label="5 stars">★</label>
        </div>
        <p class="rating-caption" id="rating-caption" aria-live="polite"></p>
      </fieldset>
      <div class="field">
        <label for="fb-comments">Tell us more <span style="font-weight:400;">(optional)</span></label>
        <textarea id="fb-comments" maxlength="1000" placeholder="What did we get right? What should we improve?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="fb-btn">Submit feedback</button>
    </form>

    <p style="margin-top: var(--space-6);"><a href="index.html" class="btn btn-secondary btn-sm">← Back to SaltStayz</a></p>
  </div>
</main>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var intro = document.getElementById("fb-intro");
  var form = document.getElementById("fb-form");
  var errBox = document.getElementById("fb-error");
  var okBox = document.getElementById("fb-success");

  var CAPTIONS = { 1: "We're sorry — tell us what went wrong.", 2: "Below par — we want to fix this.", 3: "Okay stay — room to improve.", 4: "Great — thanks!", 5: "Excellent — you made our day!" };

  function fail(msg) {
    intro.textContent = "";
    errBox.textContent = msg;
    errBox.classList.add("is-visible");
  }

  /* star highlighting */
  var row = document.getElementById("star-row");
  function paint(value) {
    row.querySelectorAll("label").forEach(function (lab, i) {
      lab.classList.toggle("lit", i < value);
    });
    document.getElementById("rating-caption").textContent = value ? CAPTIONS[value] : "";
  }
  row.addEventListener("change", function () {
    var checked = row.querySelector("input:checked");
    paint(checked ? Number(checked.value) : 0);
  });

  if (!token) { fail("This feedback link is invalid. Please use the link from your thank-you email."); return; }

  fetch("/api/feedback/" + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) return fail(res.d.error || "This feedback link is invalid.");
      if (res.d.alreadySubmitted) {
        intro.textContent = "";
        okBox.textContent = "You've already shared feedback for this stay — thank you, " + res.d.name + "!";
        okBox.classList.add("is-visible");
        return;
      }
      intro.textContent = "Hi " + res.d.name + " — thanks for staying at " + res.d.property +
        " (" + res.d.bookingId + "). How did we do?";
      form.hidden = false;
    })
    .catch(function () { fail("Could not reach the server. Please try again later."); });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    errBox.classList.remove("is-visible");
    var checked = row.querySelector("input:checked");
    if (!checked) {
      errBox.textContent = "Please choose a star rating before submitting.";
      errBox.classList.add("is-visible");
      return;
    }
    var btn = document.getElementById("fb-btn");
    btn.classList.add("is-loading");
    try {
      var res = await fetch("/api/feedback/" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating: checked.value, comments: document.getElementById("fb-comments").value }),
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not submit feedback.");
      form.hidden = true;
      intro.textContent = "";
      okBox.textContent = "Thank you! Your feedback has been shared with the SaltStayz team. We hope to host you again soon. 🌿";
      okBox.classList.add("is-visible");
    } catch (e) {
      errBox.textContent = e.message;
      errBox.classList.add("is-visible");
    } finally {
      btn.classList.remove("is-loading");
    }
  });
})();
</script>

</body>
</html>
